# GitLab requires the entry pipeline file at the repo root (or a project-wide custom path
# in Settings > CI/CD, which every module would have to share). This just points at the
# real pipeline, which lives with the module it deploys. Teammates adding their own
# module's CI add their own `include:` line here - each module still owns its own file.
include:
  - local: "messaging-notifications/.gitlab-ci.yml"
