stages:
  - test
  - build
  - plan

variables:
  PYTHON_VERSION: "3.10"
  AWS_DEFAULT_REGION: "us-east-1"

# Python unit tests - Appointments backend
test-appointments-backend:
  stage: test
  image: python:$PYTHON_VERSION
  script:
    - echo "Installing testing dependencies..."
    - pip install -r backend/appointments/requirements.txt || pip install boto3 moto
    - echo "Running unit tests for Appointments..."
    - cd backend/appointments
    - python -m unittest test_appointments.py -v
  only:
    changes:
      - backend/appointments/**/*
      - .gitlab-ci.yml

# Vitest UI tests - Frontend
test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - echo "Running frontend UI tests..."
    - npm run test
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Install check - API backend
build-backend-api:
  stage: build
  image: node:20-alpine
  script:
    - cd backend/api
    - npm ci
  only:
    changes:
      - backend/api/**/*
      - .gitlab-ci.yml

# Terraform validation
terraform-validate-appointments:
  stage: plan
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - cd terraform/modules/appointments
    - terraform init -backend=false
    - terraform validate
  only:
    changes:
      - terraform/modules/appointments/**/*
      - .gitlab-ci.yml

