stages:
  - test
  - plan

# Run Vitest UI tests for the Frontend
test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - echo "Running frontend UI tests..."
    - npm run test
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Terraform validation for the existing frontend module
terraform-validate:
  stage: plan
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - cd terraform/modules/frontend
    - terraform init -backend=false
    - terraform validate
  only:
    changes:
      - terraform/modules/frontend/**/*
      - .gitlab-ci.yml

