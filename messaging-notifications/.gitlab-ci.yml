# CI/CD for the Messaging + Notifications module (messaging-notifications/infra).
# Pattern: validate on every push, plan on MRs and main, apply is a manual gate on main.
#
# Required CI/CD variables (Settings > CI/CD > Variables) - none of these are in this repo:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (Variable, masked)
#   AWS_SESSION_TOKEN                           (Variable, masked - only if using STS/Learner Lab creds; omit for a permanent IAM user)
#   GCP_SA_KEY_FILE                              (File - paste the service account JSON key as its content)
#   TF_VAR_environment, TF_VAR_aws_region, TF_VAR_gcp_project_id, TF_VAR_gcp_region
#   TF_VAR_user_pool_id, TF_VAR_user_pool_client_id
#   TF_VAR_users_table_name, TF_VAR_appointments_table_name   (Variable - only if different from the defaults)
#   TF_VAR_existing_lambda_role_arn                            (Variable - only on IAM-restricted accounts, e.g. Learner Lab's LabRole)
#   TF_VAR_gcp_functions_aws_access_key_id, TF_VAR_gcp_functions_aws_secret_access_key, TF_VAR_gcp_functions_aws_session_token
#     (Variable, masked - the cross-cloud creds the GCP functions use to call AWS; can reuse the same values as above)
#
# State: stored via GitLab's built-in Terraform HTTP backend (no S3/GCS bucket to bootstrap).

# Only ever creates a pipeline when this module's own files change - a teammate's push
# to their own module's folder shouldn't trigger (or block on) this one.
workflow:
  rules:
    - changes:
        - messaging-notifications/**/*
        - .gitlab-ci.yml

stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/messaging-notifications/infra
  TF_STATE_NAME: messaging-notifications
  TF_IN_AUTOMATION: "true"

default:
  # hashicorp/terraform's ENTRYPOINT is the terraform binary itself (it's meant to be run
  # as `docker run hashicorp/terraform plan`) - without overriding it, GitLab's `sh -c
  # "..."` for every script line becomes `terraform sh -c "..."`, which is exactly the
  # "no command named sh" error this caused. Clearing it lets plain shell commands run.
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - apk add --no-cache nodejs npm curl
    - export GOOGLE_APPLICATION_CREDENTIALS="$GCP_SA_KEY_FILE"
    - cd "$TF_ROOT"
    - >
      terraform init -reconfigure
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="username=${GITLAB_USER_LOGIN}"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"

fmt:
  stage: validate
  script:
    - terraform fmt -check -recursive

validate:
  stage: validate
  script:
    - terraform validate

plan:
  stage: plan
  script:
    - terraform plan -out="$TF_ROOT/tfplan"
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:
  stage: apply
  script:
    - terraform apply -auto-approve "$TF_ROOT/tfplan"
  dependencies:
    - plan
  resource_group: production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

destroy:
  stage: destroy
  script:
    - terraform destroy -auto-approve
  resource_group: production
  environment:
    name: production
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
